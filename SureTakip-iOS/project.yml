# XcodeGen definition — regenerate the Xcode project with:
#   brew install xcodegen && cd SureTakip-iOS && xcodegen generate
#
# The shell has NO third-party dependencies. Authentication and all data access
# happen inside the web app, so the Firebase iOS SDK is not needed here; that
# keeps build times short and removes a whole class of version-drift problems.
name: SureTakip

options:
  bundleIdPrefix: com.davincienerji
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  SureTakip:
    type: application
    platform: iOS
    sources:
      - path: SureTakip
        excludes:
          - Info.plist
    info:
      path: SureTakip/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davincienerji.suretakip
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: SureTakip/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
        # No DEVELOPMENT_TEAM here on purpose: set it once in Xcode
        # (Signing & Capabilities) so the team ID stays out of the repo.
