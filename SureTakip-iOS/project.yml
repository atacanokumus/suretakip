# XcodeGen definition — regenerate the Xcode project with:
#   brew install xcodegen && cd SureTakip-iOS && xcodegen generate
#
# The only third-party dependency is FirebaseMessaging, and only because APNs
# push cannot be done from the web view. Authentication and all data access
# still happen inside the web app, so no Firestore/Auth SDK is pulled in here.
name: SureTakip

options:
  bundleIdPrefix: com.davincienerji
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"

targets:
  SureTakip:
    type: application
    platform: iOS
    dependencies:
      - package: Firebase
        product: FirebaseMessaging
    sources:
      - path: SureTakip
        excludes:
          - Info.plist
          # Referenced via CODE_SIGN_ENTITLEMENTS below; listing them as
          # sources would also copy them into the bundle as resources.
          - "*.entitlements"
    # NOTE: deliberately no `info:` block here.
    #
    # In XcodeGen, `info: path:` does not mean "use the plist at this path" - it
    # means "GENERATE a plist at this path", overwriting whatever is there with
    # XcodeGen's own minimal defaults plus any `properties:` given. With no
    # `properties:`, running `xcodegen generate` silently replaced the
    # hand-written Info.plist and dropped UILaunchScreen, UIUserInterfaceStyle
    # and the orientation list. An app with no launch screen declaration is
    # treated by iOS as not supporting modern display sizes, so the whole window
    # gets letterboxed - black bands above and below the app on every device.
    # Pointing INFOPLIST_FILE at the checked-in plist (below) is what actually
    # uses it.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davincienerji.suretakip
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        INFOPLIST_FILE: SureTakip/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2" # iPhone + iPad
        # No DEVELOPMENT_TEAM here on purpose: set it once in Xcode
        # (Signing & Capabilities) so the team ID stays out of the repo.
      configs:
        # Separate entitlements per configuration so the APNs environment
        # matches how the build is actually distributed. One shared file would
        # force a choice that is wrong for half the cases.
        Debug:
          CODE_SIGN_ENTITLEMENTS: SureTakip/SureTakip.Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: SureTakip/SureTakip.Release.entitlements
